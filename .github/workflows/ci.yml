name: CI

on: [push, pull_request]

# 同 release.yml：runner 的 stdout 是 cp1252，Python 输出统一成 UTF-8，
# 免得脚本里一句中文 print 就把构建打成 UnicodeEncodeError。
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Run unit tests
        run: python -m pytest

  # 无头 webview 窗口在 CI 上依赖桌面会话/WebView2 时序，实测会偶发**与代码无关**的随机失败：
  # 同一个用例本地连跑多轮全绿、上一轮 CI 也绿，下一轮却挂在"元素还没渲染出来 / 状态还没落地"上
  # （徽标读到启动前的旧值、点击时 querySelector 返回 null 等，已连续踩到三个不同用例）。
  # 所以这里只给 e2e 加**重试**（--reruns 2），而不是 continue-on-error：
  #   · 真回归会连挂 3 次，照样拦住提交（门禁强度不变）；
  #   · 纯时序抖动被重试吸收，不再让 master 无端变红。
  # 单测 job **不**加重试——它是确定性的，重试只会掩盖真问题。
  e2e:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run headless E2E tests
        run: python -m pytest -m e2e --reruns 2 --reruns-delay 5

  # 打包冒烟：仅主分支，构建 exe 并启动 5 秒验证
  package:
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      # 同 release.yml：失败原因打成 `::error::` 注解（日志未登录读不到，注解公开可读）
      - name: Build
        shell: pwsh
        run: |
          python -m PyInstaller MyNotepad.spec 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content build.log -Tail 30) -join ' | ')
            if ($tail.Length -gt 1800) { $tail = $tail.Substring($tail.Length - 1800) }
            Write-Host "::error title=PyInstaller 构建失败::$tail"
            exit 1
          }
      # 与 release.yml 同一套闸门：Tcl/Tk 数据缺一个，打包版就起不来（2026-09-27 的教训）
      - name: Verify Tcl/Tk data landed in the bundle
        run: python build_resources/tcl_tk_data.py dist/MyNotepad
      # 静态闸门只证明"目录里有标记文件"，这一步证明**冻结产物里 Tk 真的能起来**：
      # v1.0.0 那个坏包的 `_tk_data` 里装的是 Tcl 库，静态检查（当年用宽松标记）放行了，
      # 而真起 Tk 会当场抛错 —— 选图片/选附件/换背景/确认框全走 tkinter。
      - name: Verify Tk works in the frozen app
        shell: pwsh
        run: |
          $tk = "$env:RUNNER_TEMP\tk-selftest.json"
          $p = Start-Process -FilePath "dist\MyNotepad\MyNotepad.exe" -ArgumentList '--tk-selftest','--out',$tk -PassThru -Wait
          if (-not (Test-Path $tk)) { Write-Error "Tk 自检没有产出文件，冻结运行时没起来（exit code: $($p.ExitCode)）"; exit 1 }
          $info = Get-Content $tk -Raw | ConvertFrom-Json
          Write-Host "Tk 自检：$($info | ConvertTo-Json -Compress)"
          if (-not $info.tk_data_ok) {
            Write-Host "::error title=Tk 数据不对::_tk_data 里没有 Tk 脚本库（tk.tcl / ttk）；markers=[$($info.tk_data_markers -join ',')] top=[$($info.tk_data_top -join ',')]"
            exit 1
          }
          if (-not $info.tk_ok) { Write-Host "::error title=Tk 起不来::$($info.tk_error)"; exit 1 }
          if (-not ($info.filedialog -and $info.messagebox)) {
            Write-Host "::error title=tkinter 对话框不可用::filedialog=$($info.filedialog) messagebox=$($info.messagebox)"
            exit 1
          }
          Write-Host "Tk 冒烟通过：Tk $($info.tk_patchlevel)，filedialog/messagebox 都在"
      - name: Smoke test
        shell: pwsh
        run: |
          $env:MYNOTEPAD_DATA_DIR = "$env:RUNNER_TEMP\smoke"
          $selftest = "$env:RUNNER_TEMP\selftest.json"
          # ① 功能冒烟：自检必须产出文件（证明冻结运行时真的跑起来了，不只是"进程没退出"）
          $p = Start-Process -FilePath "dist\MyNotepad\MyNotepad.exe" -ArgumentList '--ocr-selftest','--out',$selftest -PassThru -Wait
          if (-not (Test-Path $selftest)) { Write-Error "功能冒烟失败：自检没有产出文件（exit code: $($p.ExitCode)）"; exit 1 }
          Write-Host "功能冒烟通过，自检输出：$(Get-Content $selftest -Raw)"
          # ② 界面冒烟：正常启动 5 秒不许退出
          $p2 = Start-Process -FilePath "dist\MyNotepad\MyNotepad.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p2.HasExited) { Write-Error "界面冒烟失败：应用启动后 5 秒内退出（exit code: $($p2.ExitCode)）"; exit 1 }
          Stop-Process -Id $p2.Id
          Write-Host "界面冒烟通过：应用运行 5 秒无崩溃"
